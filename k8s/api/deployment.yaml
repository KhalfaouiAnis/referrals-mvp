apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: referrals
  labels:
    app: api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: api
    spec:
      # Run migrations before any API replica starts
      initContainers:
      - name: migrate
        image: referrals-api:latest
        imagePullPolicy: IfNotPresent
        command: [ "node", "/app/apps/api/dist/database/run-migrations.js" ]
        envFrom:
        - configMapRef:
            name: referrals-config
        - secretRef:
            name: referrals-secrets
      containers:
      - name: api
        image: referrals-api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
        envFrom:
        - configMapRef:
            name: referrals-config
        - secretRef:
            name: referrals-secrets
        readinessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /api/v1/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 15
        resources:
          requests:
            cpu: "200m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: referrals
spec:
  selector:
    app: api
  ports:
  - port: 3000
    targetPort: 3000
  type: ClusterIP
